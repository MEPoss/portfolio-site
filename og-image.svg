<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0C0C0B"/>

  <!-- Subtle grid texture -->
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1A1A18" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.6"/>

  <!-- Green accent bar left -->
  <rect x="80" y="200" width="3" height="180" fill="#38BF77" rx="2"/>

  <!-- Avatar circles (decorative) -->
  <circle cx="950" cy="200" r="80" fill="#3DBA7A" opacity="0.12"/>
  <circle cx="1040" cy="260" r="60" fill="#3DBA7A" opacity="0.08"/>
  <circle cx="880" cy="300" r="50" fill="#3DBA7A" opacity="0.06"/>

  <!-- Pixel ghost icon -->
  <text x="950" y="230" font-family="serif" font-size="90" text-anchor="middle" dominant-baseline="middle">👾</text>

  <!-- Name -->
  <text x="110" y="280" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="76" font-weight="normal" fill="#EAE8E2" letter-spacing="-1">Ugo Possenti</text>

  <!-- Role -->
  <text x="112" y="340" font-family="-apple-system, system-ui, sans-serif" font-size="26" font-weight="400" fill="#888680" letter-spacing="0.5">Product Designer · Italy</text>

  <!-- Divider -->
  <rect x="110" y="375" width="400" height="1" fill="#272623"/>

  <!-- Tags -->
  <rect x="110" y="400" width="130" height="34" rx="17" fill="#1A1A18" stroke="#272623" stroke-width="1"/>
  <text x="175" y="422" font-family="-apple-system, system-ui, sans-serif" font-size="14" fill="#38BF77" text-anchor="middle" font-weight="500">Treedom</text>

  <rect x="252" y="400" width="130" height="34" rx="17" fill="#1A1A18" stroke="#272623" stroke-width="1"/>
  <text x="317" y="422" font-family="-apple-system, system-ui, sans-serif" font-size="14" fill="#38BF77" text-anchor="middle" font-weight="500">ESA · EU</text>

  <rect x="394" y="400" width="160" height="34" rx="17" fill="#1A1A18" stroke="#272623" stroke-width="1"/>
  <text x="474" y="422" font-family="-apple-system, system-ui, sans-serif" font-size="14" fill="#38BF77" text-anchor="middle" font-weight="500">120k+ users</text>

  <!-- URL -->
  <text x="110" y="530" font-family="'Courier New', monospace" font-size="18" fill="#444240" letter-spacing="0.5">ugopossenti.com</text>
</svg>
